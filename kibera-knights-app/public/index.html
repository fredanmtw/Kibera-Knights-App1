<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Kibera Knights Chess Club</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d1b16;--mut:#6b675c;--acc:#2b4a2f;--line:#e2ded2}
@media(prefers-color-scheme:dark){:root{--bg:#15170f;--card:#1f2217;--ink:#efece1;--mut:#a09c8d;--acc:#7fb583;--line:#33372a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--card)}
.logo{height:56px;width:auto;max-width:90px;border-radius:6px;object-fit:contain;background:#fff}h1{font-size:18px;margin:0}small,.mut{color:var(--mut)}
.right{margin-left:auto;text-align:right;font-size:13px}
nav{display:flex;gap:6px;padding:10px 18px;overflow-x:auto}
nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:8px;cursor:pointer}
nav button.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
main{max-width:960px;margin:0 auto;padding:0 18px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.login{max-width:340px;margin:60px auto}.login form{flex-direction:column}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mut);font-weight:500;font-size:13px}
form{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
input,select{padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;min-width:120px;flex:1}
.btn{padding:8px 14px;border:0;border-radius:6px;background:var(--acc);color:var(--bg);cursor:pointer;font:inherit}
.lnk{background:none;border:0;color:var(--acc);cursor:pointer;font:inherit;padding:0 6px}.x{color:#b3412f}
.err{color:#b3412f;min-height:1.4em}
</style></head><body>
<header><img class="logo" id="logo" src="/logo.jpg" alt="Kibera Knights logo"><div><h1>Kibera Knights Chess Club</h1><small>Players · Coaches · Tournaments</small></div><div class="right" id="who"></div></header>
<nav id="nav"></nav><main id="main"></main>
<script>
const LEVELS=["Primary","Junior Secondary","Senior Secondary","College / Adult"],CATS=["Under 8","Under 10","Under 12","Under 14","Under 16","Under 18","Open"];
let me=null,S={players:[],coaches:[],tournaments:[],results:[]},U=[],tab="Players",editing=null;
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const canEdit=()=>me&&me.role!=="member",isAdmin=()=>me&&me.role==="admin";
// Fallback emblem if /logo.png is missing
$("#logo").onerror=function(){this.onerror=null;this.src="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><circle cx="24" cy="24" r="24" fill="#2b4a2f"/><path d="M15 36h19v-3H15zM17 32c0-6 3-9 6-12l-5 1-2-4 8-5c5-2 9 1 10 6l2 14z" fill="#f6f4ef"/></svg>')};
async function api(method,url,body){let r,t;try{r=await fetch("/api/"+url,{method,headers:{"Content-Type":"application/json","X-Requested-With":"fetch"},body:body?JSON.stringify(body):undefined});t=await r.text()}catch(_){throw new Error("Cannot reach the server. Make sure the app is running (node server.js or start.bat) and that you opened http://localhost:3000 in the browser.")}
let j={};try{j=JSON.parse(t)}catch(_){}
if(!r.ok){const e=new Error(j.error||`Unexpected reply from the server (HTTP ${r.status}${t?": "+t.replace(/<[^>]*>/g," ").trim().slice(0,80):""}). Make sure only one copy of the app is running and you are using the address shown in the server window.`);e.status=r.status;throw e}return j}
async function boot(){if(location.protocol==="file:"){$("#main").innerHTML=`<div class="card login"><h3>Start the app first</h3><p>This page was opened directly from the folder, so it cannot log in.</p><p>Run <b>start.bat</b> (Windows) or <b>start.sh</b> (Mac/Linux), or type <code>node server.js</code> in the app folder, then open <b>http://localhost:3000</b> in your browser.</p></div>`;return}try{const st=await api("GET","status");if(st.needsSetup)return authView(true);me=await api("GET","me");await after()}catch(e){authView(false)}}
async function after(){if(me.mustChange)return pwView();await load();shell()}
function pwView(){$("#nav").innerHTML="";$("#who").innerHTML=`<button class="lnk" onclick="logout()">Log out</button>`;$("#main").innerHTML=`<div class="card login"><h3>Choose your own password</h3><p class="mut">You signed in with a temporary password. Set a new one to continue.</p><form id="pf"><input name="current" type="password" placeholder="Temporary password" autocomplete="current-password" required><input name="next" type="password" placeholder="New password (8+ characters)" autocomplete="new-password" required><input name="again" type="password" placeholder="Repeat new password" autocomplete="new-password" required><button class="btn">Save and continue</button></form><div class="err" id="pe"></div></div>`;$("#pf").onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(d.next!==d.again)return $("#pe").textContent="Passwords do not match";try{await api("POST","password",{current:d.current,next:d.next});me.mustChange=false;await after()}catch(x){$("#pe").textContent=x.message}}}
function authView(setup){$("#nav").innerHTML="";$("#who").innerHTML="";$("#main").innerHTML=`<div class="card login"><h3>${setup?"First-time setup: create the admin account":"Sign in"}</h3><form id="af">${setup?'<input name="name" placeholder="Full name" required>':""}<input name="username" placeholder="Username" autocomplete="username" required><input name="password" type="password" placeholder="Password${setup?" (8+ characters)":""}" autocomplete="${setup?"new-password":"current-password"}" required><button class="btn">${setup?"Create admin":"Sign in"}</button></form><div class="err" id="ae"></div></div>`;
$("#af").onsubmit=async e=>{e.preventDefault();try{me=await api("POST",setup?"setup":"login",Object.fromEntries(new FormData(e.target)));await after()}catch(x){$("#ae").textContent=x.message}}}
async function load(){S=await api("GET","data");if(isAdmin())U=await api("GET","users")}
function shell(){$("#who").innerHTML=`${esc(me.name)} <small>(${me.role})</small><br><button class="lnk" onclick="chpw()">Change password</button><button class="lnk" onclick="logout()">Log out</button>`;render()}
async function logout(){await api("POST","logout");me=null;authView(false)}
async function chpw(){const current=prompt("Current password:");if(!current)return;const next=prompt("New password (8+ characters):");if(!next)return;try{await api("POST","password",{current,next});alert("Password changed")}catch(e){alert(e.message)}}
const nm=(c,id)=>(S[c].find(x=>x.id===id)||{}).name||"—";
const stats=pid=>{const r=S.results.filter(x=>x.playerId===pid);return{n:r.length,pts:r.reduce((a,x)=>a+(+x.points||0),0),best:r.length?Math.min(...r.map(x=>+x.rank||999)):null}};
const FORMS={
players:()=>[["name","Full name"],["rating","Rating","number"],["school","School name"],["level","School level",LEVELS],["category","Category",CATS],["coachId","Coach",S.coaches.map(c=>[c.id,c.name])],["joined","Joined","date"],["guardianName","Parent / guardian name"],["guardianPhone","Parent / guardian phone","tel"],["phone","Player phone","tel"],["email","Player email","email"]],
coaches:()=>[["name","Full name"],["specialty","Specialty / level"],["school","School"],["phone","Phone","tel"],["email","Email","email"]],
tournaments:()=>[["name","Tournament name"],["date","Date","date"],["venue","Venue"]],
results:()=>[["tournamentId","Tournament",S.tournaments.map(t=>[t.id,t.name])],["playerId","Player",S.players.map(p=>[p.id,p.name])],["points","Points","number"],["rounds","Rounds","number"],["rank","Final rank","number"]]};
function form(c){if(!canEdit())return"";const e=editing&&editing.c===c?editing.r:{};
return `<form onsubmit="event.preventDefault();save(this,'${c}')">${FORMS[c]().map(([n,p,t])=>Array.isArray(t)?`<select name="${n}"><option value="">${p}</option>${t.map(o=>{const[v,l]=Array.isArray(o)?o:[o,o];return`<option value="${esc(v)}" ${e[n]===v?"selected":""}>${esc(l)}</option>`}).join("")}</select>`:`<input name="${n}" placeholder="${p}" type="${t||"text"}" step="any" value="${esc(e[n])}">`).join("")}<button class="btn">${editing&&editing.c===c?"Save changes":"Add"}</button>${editing&&editing.c===c?'<button type="button" class="lnk" onclick="editing=null;render()">Cancel</button>':""}</form><div class="err" id="fe-${c}"></div>`}
async function save(f,c){const d={};new FormData(f).forEach((v,k)=>{if(v!=="")d[k]=f[k].type==="number"?+v:v});
try{if(editing&&editing.c===c)await api("PUT",`${c}/${editing.r.id}`,d);else await api("POST",c,d);editing=null;await load();render()}catch(e){$("#fe-"+c).textContent=e.message}}
async function del(c,id){if(!confirm("Delete this record?"))return;try{await api("DELETE",`${c}/${id}`);await load();render()}catch(e){alert(e.message)}}
function edit(c,id){editing={c,r:S[c].find(x=>x.id===id)};render();scrollTo(0,0)}
function table(c,cols,rows,acts=true){const a=acts&&canEdit();return `<div class="scroll"><table><tr>${cols.map(x=>`<th>${x[0]}</th>`).join("")}${a?"<th></th>":""}</tr>${rows.map(r=>`<tr>${cols.map(x=>`<td>${esc(x[1](r))}</td>`).join("")}${a?`<td><button class="lnk" onclick="edit('${c}','${r.id}')">Edit</button>${isAdmin()?`<button class="lnk x" onclick="del('${c}','${r.id}')">Delete</button>`:""}</td>`:""}</tr>`).join("")||'<tr><td class="mut">No records yet.</td></tr>'}</table></div>`}
function render(){const tabs=["Players","Coaches","Tournaments","Leaderboard"].concat(isAdmin()?["Users"]:[]);
$("#nav").innerHTML=tabs.map(t=>`<button class="${t===tab?"on":""}" onclick="tab='${t}';editing=null;render()">${t}</button>`).join("");let h="";
if(tab==="Players")h=`<div class="card"><h3>Players (${S.players.length})</h3>${form("players")}${table("players",[["Name",r=>r.name],["Rating",r=>r.rating],["School",r=>r.school||"—"],["School level",r=>r.level||"—"],["Category",r=>r.category||"—"],["Coach",r=>r.coachId?nm("coaches",r.coachId):"—"],["Joined",r=>r.joined],...(canEdit()?[["Guardian",r=>r.guardianName],["Guardian phone",r=>r.guardianPhone],["Phone",r=>r.phone],["Email",r=>r.email]]:[]),["Events",r=>stats(r.id).n],["Points",r=>stats(r.id).pts]],S.players)}</div>`;
if(tab==="Coaches")h=`<div class="card"><h3>Coaches (${S.coaches.length})</h3>${form("coaches")}${table("coaches",[["Name",r=>r.name],["Specialty",r=>r.specialty],["School",r=>r.school||"—"],...(canEdit()?[["Phone",r=>r.phone],["Email",r=>r.email]]:[]),["Players",r=>S.players.filter(p=>p.coachId===r.id).length]],S.coaches)}</div>`;
if(tab==="Tournaments")h=`<div class="card"><h3>Tournaments</h3>${form("tournaments")}${table("tournaments",[["Name",r=>r.name],["Date",r=>r.date],["Venue",r=>r.venue],["Entries",r=>S.results.filter(x=>x.tournamentId===r.id).length]],S.tournaments)}</div><div class="card"><h3>Results</h3>${form("results")}${table("results",[["Tournament",r=>nm("tournaments",r.tournamentId)],["Player",r=>nm("players",r.playerId)],["Points",r=>r.points],["Rounds",r=>r.rounds],["Rank",r=>r.rank]],S.results)}</div>`;
if(tab==="Leaderboard"){const rows=S.players.map(p=>({...p,...stats(p.id)})).sort((a,b)=>b.pts-a.pts);h=`<div class="card"><h3>Leaderboard</h3><form><select onchange="window.lc=this.value;render()"><option value="">All categories</option>${CATS.map(c=>`<option ${window.lc===c?"selected":""}>${c}</option>`).join("")}</select></form>${table("x",[["#",r=>rows.indexOf(r)+1],["Player",r=>r.name],["School",r=>r.school||"—"],["Category",r=>r.category||"—"],["Points",r=>r.pts],["Events",r=>r.n],["Best rank",r=>r.best===999||r.best==null?"—":r.best]],rows.filter(r=>!window.lc||r.category===window.lc),false)}</div>`}
if(tab==="Users")h=`<div class="card"><h3>User accounts</h3><p class="mut">Admin: full access. Coach: add/edit club data. Member: view only.</p><form onsubmit="event.preventDefault();addUser(this)"><input name="name" placeholder="Full name" required><input name="username" placeholder="Username" required><input name="email" type="email" placeholder="Email"><input name="phone" type="tel" placeholder="Phone"><input name="password" type="password" placeholder="Temporary password (8+)" required><select name="role"><option value="member">Member (view only)</option><option value="coach">Coach (can edit)</option><option value="admin">Admin</option></select><button class="btn">Create user</button></form><div class="err" id="ue"></div>${table("u",[["Name",r=>r.name],["Username",r=>r.username],["Email",r=>r.email],["Phone",r=>r.phone],["Role",r=>r.role]],U,false).replace(/<\/tr>(?=<tr>|<\/table>)/g,m=>m)}${U.map(u=>u.id===me.id?"":`<button class="lnk x" onclick="delUser('${u.id}','${esc(u.username)}')">Remove ${esc(u.username)}</button>`).join("")}</div>`;
$("#main").innerHTML=h}
async function addUser(f){try{await api("POST","users",Object.fromEntries(new FormData(f)));await load();render()}catch(e){$("#ue").textContent=e.message}}
async function delUser(id,n){if(confirm("Remove user "+n+"?")){await api("DELETE","users/"+id);await load();render()}}
boot();
</script></body></html>
